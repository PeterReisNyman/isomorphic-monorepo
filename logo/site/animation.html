   return `<g fill="none" stroke="${colors[k]}" stroke-linecap="round"><path d="${d}" stroke-width="1" stroke-opacity=".55" stroke-dasharray="3 4"/><path class="trace" d="${d}" pathLength="1" stroke-width="1.5" stroke-opacity=".85"/><circle cx="${end[0]}" cy="${end[1]}" r="3.5" stroke-width="1"/><circle class="ball-dot" r="3" fill="${colors[k]}" stroke="white" stroke-width=".7"/></g>`;
  }).join('');
  pathDots=[...paths.querySelectorAll('.ball-dot')];pathTraces=[...paths.querySelectorAll('.trace')];
 }
 routes.forEach((points,k)=>{
  const v=Math.min(points.length-1,u*(points.length-1)),j=Math.floor(v),next=Math.min(points.length-1,j+1),q=v-j;
  pathDots[k].setAttribute('cx',points[j][0]*(1-q)+points[next][0]*q);
  pathDots[k].setAttribute('cy',points[j][1]*(1-q)+points[next][1]*q);
  const fractions=motionPaths[i].pathProgress?.[k],arc=fractions?fractions[j]*(1-q)+fractions[next]*q:u;
  pathTraces[k].setAttribute('stroke-dasharray',`${arc} 1`);
 });
}
document.querySelector('#paths-toggle').addEventListener('click',e=>{
 paths.hidden=!paths.hidden;paths.style.display=paths.hidden?'none':'';e.currentTarget.setAttribute('aria-pressed',!paths.hidden);update();
});
fetch('animation-assets/motion-paths.json?v=6').then(r=>r.json()).then(data=>{motionPaths=data;update();});
const timestamp=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function update(){
 const t=video.currentTime||0,i=Math.min(stages.length-1,Math.floor(t/cycle)),local=t-i*cycle,j=(i+1)%stages.length;
 const moving=local>=hold,frameLocal=Math.max(0,Math.floor((t+1e-7)*60)/60-i*cycle),progress=moving?smoothClock(Math.max(0,Math.min(1,(frameLocal-hold)/move))):0,arriving=progress>=.8,active=arriving?j:i;
 drawPaths(i,progress);
 name.textContent=arriving?stages[j].name:moving?`${stages[i].name} → ${stages[j].name}`:stages[i].name;
 phase.textContent=moving?'Following splines':`Holding · ${(hold-local).toFixed(1)}s`;
 counter.textContent=`${String(active+1).padStart(2,'0')} / 11`;
 thumbs.forEach((b,k)=>b.setAttribute('aria-current',k===active?'step':'false'));
 timeline.value=t;clock.textContent=`${timestamp(t)} / ${timestamp(duration)}`;
 play.textContent=video.paused?'Play':'Pause';play.setAttribute('aria-label',`${video.paused?'Play':'Pause'} animation`);
}
function jump(i){video.pause();video.currentTime=((i%stages.length+stages.length)%stages.length)*cycle+.1;update();}
function toggle(){if(video.paused)video.play().catch(()=>{document.querySelector('#status').textContent='Press Play to start the animation.';});else video.pause();}
sequence.addEventListener('click',e=>{const b=e.target.closest('[data-stage]');if(b)jump(Number(b.dataset.stage));});
play.addEventListener('click',toggle);video.addEventListener('click',toggle);
document.querySelector('#previous').addEventListener('click',()=>jump(Math.floor(video.currentTime/cycle)-1));
document.querySelector('#next').addEventListener('click',()=>jump(Math.floor(video.currentTime/cycle)+1));
timeline.addEventListener('input',()=>{video.pause();video.currentTime=Math.min(Number(timeline.value),duration-.001);update();});
document.querySelector('#speed').addEventListener('change',e=>{video.playbackRate=Number(e.target.value);});
document.querySelector('#invert').addEventListener('click',e=>{const dark=document.body.classList.toggle('dark');e.currentTarget.setAttribute('aria-pressed',dark);});
for(const event of ['timeupdate','seeked','play','pause','loadedmetadata'])video.addEventListener(event,update);
video.addEventListener('error',()=>{document.querySelector('#status').textContent='The video could not load. Open the MP4 using the Save MP4 link.';});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();toggle();}if(e.code==='ArrowRight'){e.preventDefault();jump(Math.floor(video.currentTime/cycle)+1);}if(e.code==='ArrowLeft'){e.preventDefault();jump(Math.floor(video.currentTime/cycle)-1);}});
function tick(){if(!video.paused)update();requestAnimationFrame(tick)}requestAnimationFrame(tick);
// A local Python static server does not implement byte ranges. Loading a Blob
// makes every chapter seekable in WebKit as well as Chromium, without changing
// the user's existing gallery server.
fetch('animation-assets/isomorphic-motion.mp4?v=6').then(r=>{if(!r.ok)throw Error('Video unavailable');return r.blob();}).then(blob=>{
 video.src=URL.createObjectURL(blob);
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)video.play().catch(()=>{});
}).catch(()=>{document.querySelector('#status').textContent='The video could not load. Open the MP4 using the Save MP4 link.';});
</script>
