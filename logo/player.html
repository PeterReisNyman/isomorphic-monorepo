<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isomorphic · In motion</title>
<style>
:root{color-scheme:light;--paper:#fff;--ink:#161816;--muted:#7c817b;--line:#e3e6e0;--wash:#f4f5f2}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;transition:background .2s,color .2s}body.dark{color-scheme:dark;--paper:#000;--ink:#f3f4f0;--muted:#969b94;--line:#292c27;--wash:#151713}
main{max-width:1180px;margin:auto;padding:24px 32px 28px}header{display:flex;align-items:center;justify-content:space-between;gap:18px}header .brand{font-size:21px;letter-spacing:-.8px;font-weight:550}header .caption{margin-left:18px;color:var(--muted);font-size:13px}a{color:inherit;text-underline-offset:4px;text-decoration-color:var(--line)}header a{text-decoration:none;font-size:13px}
.stage{height:min(55vh,600px);min-height:250px;position:relative;margin:14px 0 0}.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:pointer}.dark video,.dark .thumb svg{filter:invert(1)}.paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.path-toggle{font-size:12px;padding:7px 10px;background:var(--paper)}.path-toggle[aria-pressed="true"]{color:#147c72;border-color:#9ecdc5}.stage-count{position:absolute;top:24px;left:0;z-index:1;pointer-events:none;font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.08em;color:var(--muted)}.stage-note{position:absolute;right:0;top:24px;z-index:1;pointer-events:none;color:var(--muted);font-size:12px}
.info{display:flex;align-items:baseline;justify-content:space-between;gap:20px;min-height:49px;padding:10px 0 15px}.info h1{font-size:22px;font-weight:500;letter-spacing:-.45px;margin:0}.info p{color:var(--muted);margin:0;font-size:13px}
.transport{display:flex;align-items:center;gap:12px;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}button,select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--paper);border-radius:7px;cursor:pointer}button:hover,select:hover{background:var(--wash)}button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:4px}.icon{width:36px;height:36px;display:grid;place-items:center;font-size:18px;padding:0}.play{min-width:82px;height:36px;background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:550}.play:hover{opacity:.8;background:var(--ink)}.timeline{flex:1;min-width:70px;accent-color:var(--ink);height:4px;cursor:pointer}.time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}select{height:36px;padding:0 8px}.invert{height:36px;padding:0 13px;white-space:nowrap}
.sequence{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:8px;padding:22px 1px 6px;overflow-x:auto}.thumb{height:100px;min-width:0;padding:6px;border-color:transparent;position:relative;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.thumb svg{width:67px;height:67px;max-width:100%;flex:1}.thumb span{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.thumb[aria-current="step"]{border-color:var(--ink);background:var(--wash)}.foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;padding-top:12px;gap:15px}.foot a{font-size:12px}.error{color:#9d3525;font-size:13px}#status:empty{display:none}
@media(max-width:680px){main{padding:20px 18px}.caption{display:none}.stage{height:51vh;min-height:260px}.stage-note{top:4px}.info h1{font-size:18px}.info p{font-size:11px}.transport{gap:8px;flex-wrap:wrap}.timeline{order:10;flex-basis:100%;margin:12px 0 4px}.time{margin-left:auto}.sequence{grid-template-columns:repeat(11,70px);gap:7px;padding-top:16px}.thumb{height:91px}.foot .hint{display:none}.stage-count{top:10px}}
</style>
<style>.path-toggle{pointer-events:auto}.dark .paths{filter:brightness(1.6)}.dark .path-toggle[aria-pressed="true"]{color:#81d1c3;border-color:#316a60}</style>
<main>
  <header><div><span class="brand">isomorphic</span><span class="caption">In motion</span></div><a href="selection.html">Back to favorites ↗</a></header>
  <div class="stage">
    <span class="stage-count" id="count">01 / 11</span><span class="stage-note"><button class="path-toggle" id="paths-toggle" aria-pressed="true">Spline paths</button></span>
    <video id="film" poster="animation-assets/poster.png" muted playsinline loop preload="auto" aria-label="Animation through your eleven favorite Isomorphic logos"></video>
    <svg class="paths" id="paths" viewBox="0 0 512 512" aria-label="Spline routes followed by each ball"></svg>
  </div>
  <div class="info"><h1 id="name">Rhythm</h1><p id="phase">7 balls · 11 favorites</p></div>
  <div class="transport">
    <button class="icon" id="previous" aria-label="Previous stage" title="Previous stage">←</button>
    <button class="play" id="play" aria-label="Play animation">Play</button>
    <button class="icon" id="next" aria-label="Next stage" title="Next stage">→</button>
    <input class="timeline" id="timeline" type="range" min="0" max="48.4" step=".01" value="0" aria-label="Animation timeline">
    <span class="time" id="time">0:00 / 0:48</span>
    <select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
    <button class="invert" id="invert" aria-pressed="false">Invert</button>
  </div>
  <nav class="sequence" aria-label="Choose a favorite stage" id="sequence"></nav>
  <div class="foot"><span>11 forms · 2 second holds</span><span class="hint">Space to pause · Arrow keys to step</span><a href="animation-assets/isomorphic-motion.mp4" download="isomorphic-motion.mp4">Save MP4 ↗</a></div>
  <p class="error" id="status" role="status"></p>
</main>
<script>
const stages=__STAGES__;
const video=document.querySelector('#film'),play=document.querySelector('#play'),timeline=document.querySelector('#timeline');
const {duration,cycle,hold,move}=__TIMING__;
const smoothClock=t=>t*t*t*(t*(t*6-15)+10);
const sequence=document.querySelector('#sequence');
sequence.innerHTML=stages.map((s,i)=>`<button class="thumb" data-stage="${i}" aria-label="Stage ${i+1}: ${s.name}" title="${s.name}" aria-current="${i===0?'step':'false'}">${s.svg}<span>${String(i+1).padStart(2,'0')}</span></button>`).join('');
const thumbs=[...sequence.children];
const name=document.querySelector('#name'),phase=document.querySelector('#phase'),counter=document.querySelector('#count'),clock=document.querySelector('#time');
let motionPaths=[],pathStage=-1,pathDots=[],pathTraces=[];
const paths=document.querySelector('#paths');
const colors=['#167e73','#5779bd','#b57038','#9756aa','#b74d70','#7b852b','#2a91a0'];
function drawPaths(i,u){
 if(!motionPaths.length||paths.hidden)return;
 const routes=motionPaths[i].pathSamples;
 if(pathStage!==i){
  pathStage=i;
  paths.innerHTML=routes.map((points,k)=>{
   const d=motionPaths[i].pathData?.[k]||points.map((p,n)=>`${n?'L':'M'}${p[0].toFixed(3)} ${p[1].toFixed(3)}`).join(' ');
   const end=points[points.length-1];
   return `<g fill="none" stroke="${colors[k]}" stroke-linecap="round"><path d="${d}" stroke-width="1" stroke-opacity=".55" stroke-dasharray="3 4"/><path class="trace" d="${d}" pathLength="1" stroke-width="1.5" stroke-opacity=".85"/><circle cx="${end[0]}" cy="${end[1]}" r="3.5" stroke-width="1"/><circle class="ball-dot" r="3" fill="${colors[k]}" stroke="white" stroke-width=".7"/></g>`;
  }).join('');
  pathDots=[...paths.querySelectorAll('.ball-dot')];pathTraces=[...paths.querySelectorAll('.trace')];
 }
 routes.forEach((points,k)=>{
  const v=Math.min(points.length-1,u*(points.length-1)),j=Math.floor(v),next=Math.min(points.length-1,j+1),q=v-j;
  pathDots[k].setAttribute('cx',points[j][0]*(1-q)+points[next][0]*q);
  pathDots[k].setAttribute('cy',points[j][1]*(1-q)+points[next][1]*q);
  const fractions=motionPaths[i].pathProgress?.[k],arc=fractions?fractions[j]*(1-q)+fractions[next]*q:u;
  pathTraces[k].setAttribute('stroke-dasharray',`${arc} 1`);
 });
}
document.querySelector('#paths-toggle').addEventListener('click',e=>{
 paths.hidden=!paths.hidden;paths.style.display=paths.hidden?'none':'';e.currentTarget.setAttribute('aria-pressed',!paths.hidden);update();
});
fetch('animation-assets/motion-paths.json?v=6').then(r=>r.json()).then(data=>{motionPaths=data;update();});
const timestamp=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function update(){
 const t=video.currentTime||0,i=Math.min(stages.length-1,Math.floor(t/cycle)),local=t-i*cycle,j=(i+1)%stages.length;
 const moving=local>=hold,frameLocal=Math.max(0,Math.floor((t+1e-7)*60)/60-i*cycle),progress=moving?smoothClock(Math.max(0,Math.min(1,(frameLocal-hold)/move))):0,arriving=progress>=.8,active=arriving?j:i;
 drawPaths(i,progress);
 name.textContent=arriving?stages[j].name:moving?`${stages[i].name} → ${stages[j].name}`:stages[i].name;
 phase.textContent=moving?'Following splines':`Holding · ${(hold-local).toFixed(1)}s`;
 counter.textContent=`${String(active+1).padStart(2,'0')} / 11`;
 thumbs.forEach((b,k)=>b.setAttribute('aria-current',k===active?'step':'false'));
 timeline.value=t;clock.textContent=`${timestamp(t)} / ${timestamp(duration)}`;
 play.textContent=video.paused?'Play':'Pause';play.setAttribute('aria-label',`${video.paused?'Play':'Pause'} animation`);
}
function jump(i){video.pause();video.currentTime=((i%stages.length+stages.length)%stages.length)*cycle+.1;update();}
function toggle(){if(video.paused)video.play().catch(()=>{document.querySelector('#status').textContent='Press Play to start the animation.';});else video.pause();}
sequence.addEventListener('click',e=>{const b=e.target.closest('[data-stage]');if(b)jump(Number(b.dataset.stage));});
play.addEventListener('click',toggle);video.addEventListener('click',toggle);
document.querySelector('#previous').addEventListener('click',()=>jump(Math.floor(video.currentTime/cycle)-1));
document.querySelector('#next').addEventListener('click',()=>jump(Math.floor(video.currentTime/cycle)+1));
timeline.addEventListener('input',()=>{video.pause();video.currentTime=Math.min(Number(timeline.value),duration-.001);update();});
document.querySelector('#speed').addEventListener('change',e=>{video.playbackRate=Number(e.target.value);});
document.querySelector('#invert').addEventListener('click',e=>{const dark=document.body.classList.toggle('dark');e.currentTarget.setAttribute('aria-pressed',dark);});
for(const event of ['timeupdate','seeked','play','pause','loadedmetadata'])video.addEventListener(event,update);
video.addEventListener('error',()=>{document.querySelector('#status').textContent='The video could not load. Open the MP4 using the Save MP4 link.';});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();toggle();}if(e.code==='ArrowRight'){e.preventDefault();jump(Math.floor(video.currentTime/cycle)+1);}if(e.code==='ArrowLeft'){e.preventDefault();jump(Math.floor(video.currentTime/cycle)-1);}});
function tick(){if(!video.paused)update();requestAnimationFrame(tick)}requestAnimationFrame(tick);
// A local Python static server does not implement byte ranges. Loading a Blob
// makes every chapter seekable in WebKit as well as Chromium, without changing
// the user's existing gallery server.
fetch('animation-assets/isomorphic-motion.mp4?v=6').then(r=>{if(!r.ok)throw Error('Video unavailable');return r.blob();}).then(blob=>{
 video.src=URL.createObjectURL(blob);
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)video.play().catch(()=>{});
}).catch(()=>{document.querySelector('#status').textContent='The video could not load. Open the MP4 using the Save MP4 link.';});
</script>
</html>
